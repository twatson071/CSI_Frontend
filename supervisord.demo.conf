[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nginx-stdout.log
stderr_logfile=/var/log/supervisor/nginx-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
priority=100
startretries=3

[program:backend]
directory=/app/backend
command=bun run dist/index.js
autostart=true
autorestart=true
environment=NODE_ENV="production",DATABASE_URL="/app/data/demo.db",DB_FILE_NAME="/app/data/demo.db",PORT="4000",BETTER_AUTH_URL="http://localhost:4000",BETTER_AUTH_SECRET="demo-secret-key-for-testing-only",DEMO_MODE="true",ALLOW_DEMO_LOGIN="true",EXTERNAL_BASE_URL="http://localhost:4000/mock",SYSTEM_OPERATOR_KEY="demo-key",HUB_KEY="demo-hub-key"
stdout_logfile=/var/log/supervisor/backend-stdout.log
stderr_logfile=/var/log/supervisor/backend-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
priority=10
startsecs=5
startretries=3

[group:csi-demo]
programs=nginx,backend