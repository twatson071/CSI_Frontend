version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    depends_on:
      - db
    environment:
      - DB_USER=postgres
      - DB_HOST=db
      - DB_NAME=mydatabase
      - DB_PASSWORD=mysecretpassword
      - DB_PORT=5432
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./ui-react
    ports:
      - "3000:3000"
    volumes:
      - ./ui-react:/app
      - /app/node_modules
    depends_on:
      - backend

  db:
    image: postgres:13
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_DB=mydatabase
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: