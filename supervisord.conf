[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nginx-stdout.log
stderr_logfile=/var/log/supervisor/nginx-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:backend]
directory=/app/backend
command=bun run dist/index.js
autostart=true
autorestart=true
environment=NODE_ENV="production",DATABASE_URL="/app/data/production.db",PORT="3001",BETTER_AUTH_URL="http://localhost:3001"
stdout_logfile=/var/log/supervisor/backend-stdout.log
stderr_logfile=/var/log/supervisor/backend-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:db-init]
directory=/app/backend
command=/bin/sh -c 'bun run drizzle-orm migrate --config=drizzle.config.ts || true'
autostart=true
autorestart=false
startsecs=0
priority=1
stdout_logfile=/var/log/supervisor/db-init-stdout.log
stderr_logfile=/var/log/supervisor/db-init-stderr.log

[group:csi]
programs=nginx,backend